name: Build and Publish Classroom Companion

on: [push]

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial permission to allow creating tags and releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all tags, which is necessary to calculate the next version

      - name: Get Next Version
        id: versioning
        uses: reecetech/version-increment@2026.8.4
        with:
          scheme: semver
          increment: patch # Options: major, minor, patch

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version }}
          name: Release ${{ steps.versioning.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true # Automatically populates release notes with commit logs
  linux:
    name: Build and Publish for Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Waiting for creation to finish
        uses: yogeshlonkar/wait-for-jobs@v0
        with:
          # To ignore jobs that are skipped from given list of job dependencies
          # default: 'false'
          # required: false
          ignore-skipped: 'false'

          # Comma or newline separated list of names of job dependencies for this step, it must be `name:` property of job if set
          # required: true
          jobs: 'create-release'

          # Comma separated list of JSON artifacts from (jobs in) this build that will be parse to set as output for this step
          # required: false
          outputs-from: 'job1_output.json,job2_output.json'

          # Instead of exact job name match, check prefix of job names. Useful in case of reusable workflows
          # default: 'false'
          # required: false
          prefix: 'false'

          # Instead of exact job name match, check suffix of job names. Useful in case of reusable workflows
          # default: 'false'
          # required: false
          suffix: 'true'

          # Interval in milliseconds between each check of dependencies completion
          # default: '2000'
          # required: false
          interval: '2500'

          # Maximum number of minutes to wait before giving up. Step will fail with message providing remaining job names.
          # default: '5'
          # required: false
          ttl: '5'

          # If set to true, the ttl will NOT be overridden to 15 minutes if it is set more than 15 minutes
          # default: 'false'
          # required: false
          no-max-ttl: 'true'
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all tags, which is necessary to calculate the next version
        
      - name: Build
        shell: pwsh
        run: |
          python3 -m pip install -r requirements.txt
          pyinstaller --onedir --add-data "src:src" src/main.py
          Rename-Item -Path "dist" -NewName "ClassroomCompanion"
          Compress-Archive -Path "./ClassroomCompanion" -DestinationPath "ClassroomCompanion-linux.zip
      - name: Get Next Version
        id: versioning
        uses: reecetech/version-increment@2026.8.4
        with:
          scheme: semver
          increment: patch # Options: major, minor, patch

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ClassroomCompanion-linux.zip
  windows:
    name: Build and Publish for Windows
    # This instructs GitHub to use a Windows-hosted virtual machine
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Waiting for creation to finish
        uses: yogeshlonkar/wait-for-jobs@v0
        with:
          # To ignore jobs that are skipped from given list of job dependencies
          # default: 'false'
          # required: false
          ignore-skipped: 'false'

          # Comma or newline separated list of names of job dependencies for this step, it must be `name:` property of job if set
          # required: true
          jobs: 'create-release'

          # Comma separated list of JSON artifacts from (jobs in) this build that will be parse to set as output for this step
          # required: false
          outputs-from: 'job1_output.json,job2_output.json'

          # Instead of exact job name match, check prefix of job names. Useful in case of reusable workflows
          # default: 'false'
          # required: false
          prefix: 'false'

          # Instead of exact job name match, check suffix of job names. Useful in case of reusable workflows
          # default: 'false'
          # required: false
          suffix: 'true'

          # Interval in milliseconds between each check of dependencies completion
          # default: '2000'
          # required: false
          interval: '2500'

          # Maximum number of minutes to wait before giving up. Step will fail with message providing remaining job names.
          # default: '5'
          # required: false
          ttl: '5'

          # If set to true, the ttl will NOT be overridden to 15 minutes if it is set more than 15 minutes
          # default: 'false'
          # required: false
          no-max-ttl: 'true'

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all tags, which is necessary to calculate the next version
        
      - name: Build
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          pyinstaller --onedir --add-data "src:src" src/main.py
          Rename-Item -Path "dist" -NewName "ClassroomCompanion"
          Compress-Archive -Path "./ClassroomCompanion" -DestinationPath "ClassroomCompanion.zip
      - name: Get Next Version
        id: versioning
        uses: reecetech/version-increment@2026.8.4
        with:
          scheme: semver
          increment: patch # Options: major, minor, patch

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ClassroomCompanion.zip

  macos:
    name: Build and Publish for macOS
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Waiting for creation to finish
        uses: yogeshlonkar/wait-for-jobs@v0
        with:
          # To ignore jobs that are skipped from given list of job dependencies
          # default: 'false'
          # required: false
          ignore-skipped: 'false'

          # Comma or newline separated list of names of job dependencies for this step, it must be `name:` property of job if set
          # required: true
          jobs: 'create-release'

          # Comma separated list of JSON artifacts from (jobs in) this build that will be parse to set as output for this step
          # required: false
          outputs-from: 'job1_output.json,job2_output.json'

          # Instead of exact job name match, check prefix of job names. Useful in case of reusable workflows
          # default: 'false'
          # required: false
          prefix: 'false'

          # Instead of exact job name match, check suffix of job names. Useful in case of reusable workflows
          # default: 'false'
          # required: false
          suffix: 'true'

          # Interval in milliseconds between each check of dependencies completion
          # default: '2000'
          # required: false
          interval: '2500'

          # Maximum number of minutes to wait before giving up. Step will fail with message providing remaining job names.
          # default: '5'
          # required: false
          ttl: '5'

          # If set to true, the ttl will NOT be overridden to 15 minutes if it is set more than 15 minutes
          # default: 'false'
          # required: false
          no-max-ttl: 'true'
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all tags, which is necessary to calculate the next version
        
      - name: Build
        shell: pwsh
        run: |
          python3 -m pip install -r requirements.txt
          pyinstaller --onedir --add-data "src:src" src/main.py
          Rename-Item -Path "dist" -NewName "ClassroomCompanion"
          Compress-Archive -Path "./ClassroomCompanion" -DestinationPath "ClassroomCompanion-macos.zip
      - name: Get Next Version
        id: versioning
        uses: reecetech/version-increment@2026.8.4
        with:
          scheme: semver
          increment: patch # Options: major, minor, patch

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ClassroomCompanion-macos.zip
